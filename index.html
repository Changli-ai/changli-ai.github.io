  <style>
    :root {
      --azul: #1f5fd6;
      --azul-oscuro: #1648a8;

      --verde: #1e9e5a;

    @media (prefers-color-scheme: dark) {
      :root {
        --azul: #5b8ff0;
        --azul-oscuro: #3f74dc;
        --azul-claro: #1b2a45;
        --verde: #3cc47c;
        --texto: #e6ebf5;
        --suave: #a3aec4;
        --fondo: #0f1522;
        --borde: #26324a;

    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--texto);
      background: linear-gradient(180deg, var(--azul-claro), var(--fondo) 70%);
      line-height: 1.6;
    }
    main { flex: 1; display: grid; place-items: center; padding: 48px 20px; }
    .tarjeta {
      max-width: 640px; width: 100%; text-align: center;
      background: var(--fondo); border: 1px solid var(--borde); border-radius: 20px;
      padding: 40px 28px; box-shadow: var(--sombra);
    }
    .tarjeta img { width: 96px; height: 96px; margin: 0 auto 14px; display: block; }

    .sellos { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
    .sello { padding: 5px 13px; border-radius: 999px; border: 1px solid var(--borde); font-weight: 600; font-size: 14px; }
    .sello::before { content: "✓ "; color: var(--verde); font-weight: 800; }
    .acciones { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .boton {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 10px;
      font-weight: 600; text-decoration: none; border: 1px solid transparent;
    }
    .boton.principal { background: var(--azul); color: #fff; }
    .boton.principal:hover { background: var(--azul-oscuro); }
    .boton.secundario { border-color: var(--borde); color: var(--texto); }
    footer { text-align: center; padding: 22px 16px; color: var(--suave); font-size: 14px; }
    footer a { color: var(--azul); }
